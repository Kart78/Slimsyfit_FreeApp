name: Import original SlimSyFit public assets
on:
  push:
    paths:
      - .github/workflows/import-slimsyfit-assets.yml
      - assets/slimsyfit-manifest.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original image and animation bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, pathlib, time
          manifest=json.loads(pathlib.Path("assets/slimsyfit-manifest.json").read_text())
          assets=manifest["assets"]
          root=pathlib.Path("public/assets/slimsyfit")
          count=0; failed=[]
          for relative in assets:
              dest=root/relative
              dest.parent.mkdir(parents=True, exist_ok=True)
              if dest.exists() and dest.stat().st_size > 0:
                  count+=1
                  continue
              ok=False
              for host in ("https://www.slimsyfit.com/","https://slimsyfit.com/"):
                  try:
                      req=urllib.request.Request(host+relative,headers={"User-Agent":"Mozilla/5.0 (compatible; FreeAppAssetImporter/1.0)"})
                      with urllib.request.urlopen(req, timeout=35) as response:
                          data=response.read(22*1024*1024)
                          ctype=response.headers.get("Content-Type","")
                          if len(data)<30 or ctype.startswith("text/html"):
                              raise ValueError("Not an image asset: "+ctype)
                          dest.write_bytes(data)
                          print("Copied",relative,len(data),"bytes")
                          ok=True
                          count+=1
                          break
                  except Exception as e:
                      print("Could not fetch",host+relative,str(e))
              if not ok: failed.append(relative)
          print(f"Copied {count}/{len(assets)} original assets; failures={failed}")
          pathlib.Path("assets/import-report.txt").write_text(
              f"Downloaded {count} of {len(assets)} original public assets\n"
              + "\n".join(f"FAILED: {p}" for p in failed) + "\n"
          )
          required=("logo.png","images/nutrition/front-plan-bowl.png",
            "images/icons/water-drop.png","images/activity/move-today.png",
            "images/wellness/weight-bmi-bmr.png")
          if any(p in failed for p in required):
              print("WARNING: Some landing page assets were unavailable.")
          PY
      - name: Commit imported original assets to FreeApp only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/slimsyfit assets/import-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Import exact original SlimSyFit images and GIFs into independent FreeApp"
            git push
          fi
